<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Snake Moderno</title>
    <style>
        /* Estilo moderno e clean */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b1120 0%, #1a2639 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 16px;
        }

        .game-wrapper {
            background: rgba(18, 28, 46, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 48px;
            padding: 30px 35px 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.2s;
        }

        /* Placar com design moderno */
        .scoreboard {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 8px 20px 8px;
            color: #e3edff;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .score-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 22px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .score-item span:first-child {
            opacity: 0.7;
            font-weight: 400;
        }

        .score-item .value {
            font-weight: 700;
            color: #a8d8ff;
            min-width: 32px;
            text-align: center;
        }

        /* Canvas com bordas arredondadas e sombra */
        canvas {
            display: block;
            margin: 0 auto;
            background: #111b2b;
            border-radius: 28px;
            box-shadow: 0 12px 0 #0a111e, 0 20px 40px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 500px;
            height: auto;
            aspect-ratio: 1/1;
            image-rendering: auto; /* Para animações mais suaves */
            transition: filter 0.2s;
        }

        /* Painel de controles e dicas */
        .controls-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-top: 22px;
            width: 100%;
        }

        .hint {
            color: #8da0c9;
            font-size: 0.95rem;
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            letter-spacing: 0.3px;
            backdrop-filter: blur(2px);
        }

        .hint kbd {
            background: #1f2b3f;
            padding: 2px 10px;
            border-radius: 8px;
            color: #c7ddff;
            font-weight: 600;
            margin: 0 4px;
            border: 1px solid #31435e;
        }

        .btn-reset {
            background: #2f3f60;
            border: none;
            border-bottom: 5px solid #141e30;
            padding: 10px 30px;
            border-radius: 60px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: #eaf3ff;
            cursor: pointer;
            transition: 0.07s ease;
            box-shadow: 0 6px 0 #0d1422;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-reset:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        .btn-reset:hover {
            background: #3d527a;
            color: white;
            box-shadow: 0 6px 0 #1a253b;
        }

        /* estado pausa / gameover (animação) */
        .status-badge {
            transition: opacity 0.25s;
        }

        @media (max-width: 540px) {
            .game-wrapper {
                padding: 18px 16px 16px;
                border-radius: 32px;
            }
            .scoreboard {
                font-size: 1.1rem;
                padding-bottom: 12px;
            }
            .score-item {
                padding: 4px 14px;
            }
            .btn-reset {
                padding: 8px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <!-- Placar -->
        <div class="scoreboard">
            <div class="score-item">
                <span>🍎</span>
                <span class="value" id="scoreDisplay">0</span>
            </div>
            <div class="score-item">
                <span>🏆</span>
                <span class="value" id="highScoreDisplay">0</span>
            </div>
        </div>

        <!-- Canvas do jogo com animação via JS -->
        <canvas id="gameCanvas" width="500" height="500"></canvas>

        <!-- Controles e botão -->
        <div class="controls-panel">
            <div class="hint">
                <kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> 
                <span style="margin:0 6px;opacity:0.5;">·</span> 
                <kbd>Espaço</kbd> pausa
            </div>
            <button class="btn-reset" id="resetButton">⟳ Novo jogo</button>
        </div>
    </div>

    <script>
        (function() {
            // ---------- CONFIGURAÇÕES ----------
            const BOARD_SIZE = 20;
            const TILE_SIZE = 25;          // 500/20
            const INITIAL_SNAKE = [
                [10, 10],
                [9, 10],
                [8, 10]
            ];
            const INITIAL_DIR = 'RIGHT';
            const TICK_INTERVAL_MS = 150;   // velocidade

            // ---------- DOM ----------
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');
            const highScoreSpan = document.getElementById('highScoreDisplay');

            // ---------- ESTADO ----------
            let snake = [...INITIAL_SNAKE.map(pos => [...pos])];
            let food = [15, 10];
            let direction = INITIAL_DIR;
            let nextDirection = INITIAL_DIR;
            let score = 0;
            let highScore = 0;
            let gameOver = false;
            let winFlag = false;
            let paused = false;

            let gameInterval = null;
            let animationFrame = null;

            // ---------- HIGHSCORE (localStorage) ----------
            function loadHighScore() {
                const saved = localStorage.getItem('snakeModernHighScore');
                if (saved) {
                    highScore = parseInt(saved, 10);
                    if (isNaN(highScore)) highScore = 0;
                }
                highScoreSpan.textContent = highScore;
            }

            function saveHighScore() {
                localStorage.setItem('snakeModernHighScore', String(highScore));
                highScoreSpan.textContent = highScore;
            }

            // ---------- ATUALIZAR UI ----------
            function updateScoreUI() {
                scoreSpan.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    saveHighScore();
                }
                highScoreSpan.textContent = highScore;
            }

            // ---------- GERAR COMIDA (com animação) ----------
            function generateFood() {
                const totalCells = BOARD_SIZE * BOARD_SIZE;
                if (snake.length >= totalCells) {
                    winFlag = true;
                    gameOver = true;
                    clearInterval(gameInterval);
                    gameInterval = null;
                    return false;
                }

                const occupied = new Set(snake.map(cell => `${cell[0]},${cell[1]}`));
                if (occupied.size === totalCells) {
                    winFlag = true;
                    gameOver = true;
                    clearInterval(gameInterval);
                    gameInterval = null;
                    return false;
                }

                let newFood = null;
                let attempts = 0;
                while (attempts < 2000) {
                    const fx = Math.floor(Math.random() * BOARD_SIZE);
                    const fy = Math.floor(Math.random() * BOARD_SIZE);
                    if (!occupied.has(`${fx},${fy}`)) {
                        newFood = [fx, fy];
                        break;
                    }
                    attempts++;
                }

                if (!newFood) {
                    for (let y = 0; y < BOARD_SIZE; y++) {
                        for (let x = 0; x < BOARD_SIZE; x++) {
                            if (!occupied.has(`${x},${y}`)) {
                                newFood = [x, y];
                                break;
                            }
                        }
                        if (newFood) break;
                    }
                }

                if (newFood) {
                    food = newFood;
                    return true;
                } else {
                    winFlag = true;
                    gameOver = true;
                    clearInterval(gameInterval);
                    gameInterval = null;
                    return false;
                }
            }

            // ---------- RESET JOGO ----------
            function resetGame() {
                if (gameInterval) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                }
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }

                snake = INITIAL_SNAKE.map(pos => [...pos]);
                direction = INITIAL_DIR;
                nextDirection = INITIAL_DIR;
                score = 0;
                gameOver = false;
                winFlag = false;
                paused = false;

                generateFood();
                if (gameOver) { // fallback
                    gameOver = false;
                    winFlag = false;
                    snake = INITIAL_SNAKE.map(pos => [...pos]);
                    food = [15, 10];
                    direction = INITIAL_DIR;
                    nextDirection = INITIAL_DIR;
                    score = 0;
                }

                updateScoreUI();
                drawCanvas();

                if (!gameInterval) {
                    gameInterval = setInterval(gameTick, TICK_INTERVAL_MS);
                }
            }

            // ---------- PAUSE ----------
            function togglePause() {
                if (gameOver) return;
                paused = !paused;
                drawCanvas();
            }

            // ---------- TICK (movimento) ----------
            function gameTick() {
                if (paused || gameOver) {
                    drawCanvas();
                    return;
                }

                // Atualiza direção
                const opposite = {
                    'UP': 'DOWN',
                    'DOWN': 'UP',
                    'LEFT': 'RIGHT',
                    'RIGHT': 'LEFT'
                };
                if (nextDirection && opposite[nextDirection] !== direction) {
                    direction = nextDirection;
                }

                const head = snake[0];
                let newHead = [...head];
                switch (direction) {
                    case 'RIGHT': newHead[0]++; break;
                    case 'LEFT':  newHead[0]--; break;
                    case 'UP':    newHead[1]--; break;
                    case 'DOWN':  newHead[1]++; break;
                }

                // Colisão parede
                if (newHead[0] < 0 || newHead[0] >= BOARD_SIZE || newHead[1] < 0 || newHead[1] >= BOARD_SIZE) {
                    gameOver = true;
                    clearInterval(gameInterval);
                    gameInterval = null;
                    drawCanvas();
                    return;
                }

                const isEating = (newHead[0] === food[0] && newHead[1] === food[1]);

                let newSnake = [newHead, ...snake];
                if (!isEating) {
                    newSnake.pop();
                }

                // Colisão com corpo
                const headStr = `${newHead[0]},${newHead[1]}`;
                const bodyWithoutHead = newSnake.slice(1).map(cell => `${cell[0]},${cell[1]}`);
                if (bodyWithoutHead.includes(headStr)) {
                    gameOver = true;
                    clearInterval(gameInterval);
                    gameInterval = null;
                    drawCanvas();
                    return;
                }

                snake = newSnake;

                if (isEating) {
                    score++;
                    updateScoreUI();
                    const success = generateFood();
                    if (!success) {
                        drawCanvas();
                        return;
                    }
                }

                drawCanvas();
            }

            // ---------- DESENHO COM ANIMAÇÕES (moderno) ----------
            function drawCanvas() {
                // Limpa com gradiente suave
                const grad = ctx.createRadialGradient(250, 250, 50, 250, 250, 400);
                grad.addColorStop(0, '#1f3147');
                grad.addColorStop(1, '#0d1628');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 500, 500);

                // Grade sutil (moderna)
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                ctx.lineWidth = 1;
                for (let i = 0; i <= BOARD_SIZE; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * TILE_SIZE, 0);
                    ctx.lineTo(i * TILE_SIZE, 500);
                    ctx.stroke();
                    ctx.moveTo(0, i * TILE_SIZE);
                    ctx.lineTo(500, i * TILE_SIZE);
                    ctx.stroke();
                }

                // ---------- Comida com animação pulsante ----------
                const time = Date.now() / 400;
                const pulse = 0.8 + 0.2 * Math.sin(time);
                const fx = food[0] * TILE_SIZE + TILE_SIZE/2;
                const fy = food[1] * TILE_SIZE + TILE_SIZE/2;
                const radius = (TILE_SIZE/2 - 2) * pulse;

                // Brilho da comida
                const glow = ctx.createRadialGradient(fx-4, fy-4, 2, fx, fy, radius + 6);
                glow.addColorStop(0, '#ff7b5c');
                glow.addColorStop(0.7, '#e84141');
                glow.addColorStop(1, '#b71c1c');
                ctx.shadowColor = '#ff5e4a';
                ctx.shadowBlur = 18;
                ctx.beginPath();
                ctx.arc(fx, fy, radius, 0, Math.PI * 2);
                ctx.fillStyle = glow;
                ctx.fill();

                // Destaque
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(fx-4, fy-5, 5, 0, Math.PI * 2);
                ctx.fill();

                // ---------- Cobra com animação de movimento (gradiente) ----------
                snake.forEach((segment, index) => {
                    const [x, y] = segment;
                    const px = x * TILE_SIZE;
                    const py = y * TILE_SIZE;

                    // Gradiente dinâmico na cobra
                    const ratio = index / snake.length;
                    const r = Math.floor(30 + 70 * (1 - ratio));
                    const g = Math.floor(180 + 60 * ratio);
                    const b = Math.floor(200 + 40 * ratio);
                    const color = `rgb(${r}, ${g}, ${b})`;

                    // Sombra suave
                    ctx.shadowColor = 'rgba(0, 200, 255, 0.2)';
                    ctx.shadowBlur = 12;

                    // Corpo com bordas arredondadas
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.roundRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2, 6);
                    ctx.fill();

                    // Brilho interno (detalhe)
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                    ctx.beginPath();
                    ctx.roundRect(px + 4, py + 3, TILE_SIZE - 10, 4, 4);
                    ctx.fill();
                });

                // Olhos na cabeça (com animação piscando)
                if (snake.length > 0 && !gameOver) {
                    const [hx, hy] = snake[0];
                    const baseX = hx * TILE_SIZE;
                    const baseY = hy * TILE_SIZE;
                    // Olhos brilhantes
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#f0fcff';
                    ctx.beginPath();
                    ctx.arc(baseX + 8, baseY + 9, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(baseX + 17, baseY + 9, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#0e1a2b';
                    ctx.beginPath();
                    ctx.arc(baseX + 9, baseY + 8, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(baseX + 18, baseY + 8, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                // ---------- Mensagens com animação fade ----------
                if (gameOver || paused) {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
                    ctx.beginPath();
                    ctx.roundRect(100, 190, 300, 80, 24);
                    ctx.fill();

                    ctx.font = '600 34px "Segoe UI", system-ui, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    if (winFlag && gameOver) {
                        ctx.fillStyle = '#ffd966';
                        ctx.shadowColor = '#ffb347';
                        ctx.shadowBlur = 16;
                        ctx.fillText('🏆 Vitória!', 250, 230);
                    } else if (gameOver && !winFlag) {
                        ctx.fillStyle = '#ff8a80';
                        ctx.shadowColor = '#ff3d3d';
                        ctx.shadowBlur = 14;
                        ctx.fillText('💀 Game Over', 250, 230);
                    } else if (paused) {
                        ctx.fillStyle = '#80d8ff';
                        ctx.shadowColor = '#00b0ff';
                        ctx.shadowBlur = 16;
                        ctx.fillText('⏸ Pausado', 250, 230);
                    }
                    ctx.shadowBlur = 0;
                }
            }

            // polyfill roundRect para navegadores mais antigos
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (r > w/2) r = w/2;
                    if (r > h/2) r = h/2;
                    this.moveTo(x + r, y);
                    this.lineTo(x + w - r, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r);
                    this.lineTo(x + w, y + h - r);
                    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    this.lineTo(x + r, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r);
                    this.lineTo(x, y + r);
                    this.quadraticCurveTo(x, y, x + r, y);
                    this.closePath();
                    return this;
                };
            }

            // ---------- EVENTOS DE TECLADO ----------
            function handleKey(e) {
                const key = e.key;
                const controlKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Space'];
                if (controlKeys.includes(key) || key.startsWith('Arrow')) {
                    e.preventDefault();
                }

                if (key === ' ' || key === 'Space') {
                    togglePause();
                    return;
                }

                if (gameOver) return;

                const dirMap = {
                    'ArrowUp': 'UP',
                    'ArrowDown': 'DOWN',
                    'ArrowLeft': 'LEFT',
                    'ArrowRight': 'RIGHT'
                };
                if (dirMap[key]) {
                    const newDir = dirMap[key];
                    const opposite = {
                        'UP': 'DOWN',
                        'DOWN': 'UP',
                        'LEFT': 'RIGHT',
                        'RIGHT': 'LEFT'
                    };
                    if (direction !== opposite[newDir]) {
                        nextDirection = newDir;
                    }
                }
            }

            // ---------- INICIALIZAÇÃO ----------
            function init() {
                loadHighScore();
                resetGame();

                window.addEventListener('keydown', handleKey);
                document.getElementById('resetButton').addEventListener('click', resetGame);
                canvas.addEventListener('contextmenu', (e) => e.preventDefault());

                // Loop de animação contínua para efeitos (pulsação, etc)
                function animationLoop() {
                    drawCanvas();
                    animationFrame = requestAnimationFrame(animationLoop);
                }
                animationLoop();
            }

            init();
        })();
    </script>
</body>
</html>
